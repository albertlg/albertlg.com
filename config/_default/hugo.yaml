# Configuration of Hugo
# Guide: https://docs.hugoblox.com/tutorial/
# Hugo Documentation: https://gohugo.io/getting-started/configuration/#all-configuration-settings

# Website name
title: "Blog de Albert L.G."

# Website URL
baseURL: "https://albertlg.com/"

# Site publishing directory
publishDir: public

# Copyright notice
copyright: "Created with 🧠 & 🎉 by: Albert L.G. &copy; {year}"

############################
## LANGUAGE
############################

defaultContentLanguage: es
hasCJKLanguage: false
defaultContentLanguageInSubdir: false
removePathAccents: true

############################
## ADVANCED
############################

build:
  writeStats: true
enableGitInfo: false
summaryLength: 50
pagination:
  pagerSize: 10
enableEmoji: true
enableRobotsTXT: false
canonifyURLs: true
footnotereturnlinkcontents: "<sup>^</sup>"

minify:
  tdewolff:
    html:
      keepQuotes: true
ignoreFiles: ["\\.ipynb$", ".ipynb_checkpoints$", "\\.Rmd$", "\\.Rmarkdown$", "_files$", "_cache$", "\\.old/"]
disableAliases: true

permalinks:
  post: "/:slug/"
  authors: "/author/:slug/"
  tags: "/tag/:slug/"
  categories: "/category/:slug/"
  publication_types: "/publication-type/:slug/"

outputFormats:
  llms:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
    notAlternative: true

outputs:
  home: [HTML, RSS, headers, redirects, backlinks, llms]
  section: [HTML, RSS]

imaging:
  resampleFilter: lanczos
  anchor: smart
  jpeg:
    quality: 82
  webp:
    quality: 82
    hint: picture

timeout: 600000

taxonomies:
  tag: tags
  category: categories
  publication_type: publication_types
  author: authors

markup:
  _merge: deep
  highlight:
    lineNos: false

security:
  _merge: deep
  # Posts are HTML files with front matter; Hugo 0.169 blocks HTML content by default.
  allowContent: ['! ^text/org$']
  # Hugo's default list plus tailwindcss, which Hugo no longer allows by default.
  exec:
    allow: ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']

sitemap:
  _merge: deep

related:
  threshold: 80.0
  includeNewer: true
  toLower: true
  indices:
    - name: title
      weight: 60.0
    - name: summary
      weight: 50.0
    - name: tags
      weight: 80.0
    - name: categories
      weight: 70.0
    - name: authors
      weight: 20.0

cascade:
  - target:
      path: /post/**
    commentable: true
    show_related: true

frontmatter:
  lastmod: ["lastmod", ":git", "date"]

# Sentence case for auto-generated titles (e.g. tag pages): "Futuro del trabajo"
titleCaseStyle: firstupper
