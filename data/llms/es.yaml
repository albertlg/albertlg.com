intro: |-
  Este sitio recoge artículos y reflexiones sobre SEO, contenidos, IA y criterio profesional, junto con textos personales sobre familia, baloncesto, ritmo y vida cotidiana.
  En los últimos años, el foco se ha desplazado hacia la intersección entre el SEO clásico y el SEO para LLMs (IA), combinando análisis estratégico, experimentación y aprendizaje continuo.

