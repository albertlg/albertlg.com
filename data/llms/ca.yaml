title: "Blog d’Albert L.G."
summary: "Blog personal d’Albert López Gálvez, consultor en SEO, màrqueting de continguts i IA (LLMs), amb experiència des de 1998 en projectes digitals i optimització per a cercadors i models de llenguatge."
intro: |-
  Aquest lloc recull articles i reflexions sobre SEO, continguts, IA i criteri professional, juntament amb textos personals sobre família, bàsquet, ritme i vida quotidiana.
  En els darrers anys, el focus s’ha desplaçat cap a la intersecció entre el SEO clàssic i el SEO per a LLMs (IA), combinant anàlisi estratègica, experimentació i aprenentatge continu.

