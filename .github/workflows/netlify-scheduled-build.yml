name: Daily Netlify Scheduled Build

on:
  schedule:
    # Cron en UTC: "0 10 * * *" = todos los días a las 10:00 UTC.
    # Con Europe/Madrid:
    # - invierno: 11:00 local
    # - verano: 12:00 local
    - cron: "0 10 * * *"

  # Opcional: para poder lanzarlo a mano desde GitHub si quieres probarlo
  workflow_dispatch:

jobs:
  trigger-netlify-build:
    runs-on: ubuntu-latest
    steps:
      - name: Call Netlify build hook
        run: |
          curl -X POST -d '{}' "$NETLIFY_BUILD_HOOK"
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
